[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sglt2-target-trial-emulation"
version = "0.1.0"
description = "Preregistered Target Trial Emulation: Cardiovascular Effectiveness and Safety of SGLT2i vs DPP4i"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Observational Health Data Sciences & Informatics Team" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
